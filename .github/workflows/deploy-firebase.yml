# Redéploie les Cloud Functions et les règles Firestore à chaque modification
# poussée sur main (le site, lui, est servi directement par GitHub Pages).
# Connexion à Google sans clé ni secret (Workload Identity Federation) : GitHub prouve
# que le job vient de ce dépôt, branche main, et agit comme le compte de service
# github-deploy@armynoisymanagerapp.iam.gserviceaccount.com (droits limités à ce projet).
# Remplace l'ancien FIREBASE_TOKEN, qui donnait accès à tout le compte Google et a expiré.
name: Déployer Firebase

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Installer les dépendances des fonctions
        run: npm ci
        working-directory: functions

      - name: Connexion à Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/95639638697/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: github-deploy@armynoisymanagerapp.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Déployer
        run: npx --yes firebase-tools@15 deploy --only functions,firestore:rules --project armynoisymanagerapp --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
